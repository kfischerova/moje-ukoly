<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moje úkoly</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F4EF; --surface: #FFFFFF; --surface2: #F0EDE8;
    --text: #1a1714; --text-muted: #8a8279; --border: #E2DDD7;
    --osobni: #C17A54; --osobni-light: #F5E8DF;
    --rodina: #6B8F71; --rodina-light: #E2EEE4;
    --prace: #5C7A9E; --prace-light: #DDE8F2;
    --projekt: #8B6BAE; --projekt-light: #EDE5F5;
    --high: #D64A3A; --mid: #D9883A; --low: #6B8F71;
    --shadow: 0 2px 12px rgba(26,23,20,0.08);
    --shadow-lg: 0 8px 32px rgba(26,23,20,0.12);
    --radius: 14px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px; }
  .app { max-width: 820px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 8px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; }
  .date-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 300; letter-spacing: 0.06em; text-transform: uppercase; }
  .stats { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-pill { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 6px 14px; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn { border: 1.5px solid var(--border); background: var(--surface); border-radius: 100px; padding: 6px 16px; font-size: 0.8rem; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--text-muted); font-weight: 500; transition: all 0.18s; }
  .filter-btn.active, .filter-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }
  .filter-btn[data-cat="osobni"].active { background: var(--osobni); border-color: var(--osobni); color: #fff; }
  .filter-btn[data-cat="rodina"].active { background: var(--rodina); border-color: var(--rodina); color: #fff; }
  .filter-btn[data-cat="prace"].active { background: var(--prace); border-color: var(--prace); color: #fff; }
  .filter-btn[data-cat="projekt"].active { background: var(--projekt); border-color: var(--projekt); color: #fff; }
  .add-card { background: var(--surface); border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px; transition: border-color 0.2s; }
  .add-card:focus-within { border-color: var(--text); border-style: solid; }
  .add-row1 { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
  .add-input { flex: 1; border: none; outline: none; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--text); }
  .add-input::placeholder { color: var(--text-muted); }
  .add-row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type="date"], input[type="time"] { border: 1.5px solid var(--border); background: var(--surface2); border-radius: 8px; padding: 5px 10px; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: var(--text); outline: none; cursor: pointer; }
  select:focus, input[type="date"]:focus, input[type="time"]:focus { border-color: var(--text); }
  .btn-add { margin-left: auto; background: var(--text); color: #fff; border: none; border-radius: 9px; padding: 7px 18px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.12s; }
  .btn-add:hover { opacity: 0.85; transform: translateY(-1px); }
  .sort-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 0.78rem; color: var(--text-muted); }
  .sort-bar select { font-size: 0.78rem; padding: 4px 8px; }
  .tasks { display: flex; flex-direction: column; gap: 8px; }
  .task-card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; box-shadow: var(--shadow); border-left: 4px solid transparent; transition: box-shadow 0.18s, transform 0.14s, opacity 0.3s; animation: slideIn 0.22s ease; position: relative; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .task-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .task-card.done { opacity: 0.5; }
  .task-card.done .task-title { text-decoration: line-through; }
  .task-card[data-cat="osobni"] { border-left-color: var(--osobni); }
  .task-card[data-cat="rodina"] { border-left-color: var(--rodina); }
  .task-card[data-cat="prace"] { border-left-color: var(--prace); }
  .task-card[data-cat="projekt"] { border-left-color: var(--projekt); }
  .task-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; cursor: pointer; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; background: transparent; }
  .task-check.checked { background: var(--rodina); border-color: var(--rodina); }
  .task-check.checked::after { content: '✓'; color: #fff; font-size: 11px; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 0.93rem; font-weight: 500; margin-bottom: 4px; line-height: 1.35; }
  .task-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 0.72rem; font-weight: 500; border-radius: 6px; padding: 2px 8px; letter-spacing: 0.02em; }
  .tag-cat-osobni { background: var(--osobni-light); color: var(--osobni); }
  .tag-cat-rodina { background: var(--rodina-light); color: var(--rodina); }
  .tag-cat-prace  { background: var(--prace-light);  color: var(--prace); }
  .tag-cat-projekt{ background: var(--projekt-light);color: var(--projekt); }
  .tag-prio-high { background: #FDECEA; color: var(--high); }
  .tag-prio-mid  { background: #FDF1E6; color: var(--mid); }
  .tag-prio-low  { background: var(--rodina-light); color: var(--low); }
  .task-date { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 3px; }
  .task-date.overdue { color: var(--high); font-weight: 600; }
  .task-date.today { color: var(--mid); font-weight: 600; }
  .notif-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; padding: 2px 8px; border-radius: 6px; background: #E8F0FB; color: var(--prace); cursor: pointer; font-weight: 500; border: none; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .notif-badge:hover { background: var(--prace-light); }
  .delete-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0 2px; opacity: 0; transition: opacity 0.15s, color 0.15s; line-height: 1; flex-shrink: 0; }
  .task-card:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { color: var(--high); }
  .empty { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 0.9rem; }
  .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 22px; border-radius: 100px; font-size: 0.85rem; font-family: 'DM Sans', sans-serif; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; pointer-events: auto; }
  @media (max-width: 600px) { .add-row2 { flex-direction: column; align-items: flex-start; } .btn-add { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Moje úkoly</h1>
    <span class="date-label" id="dateLabel"></span>
  </header>
  <div class="stats" id="statsBar"></div>
  <div class="filters">
    <button class="filter-btn active" data-cat="all">Vše</button>
    <button class="filter-btn" data-cat="osobni">🧘 Osobní</button>
    <button class="filter-btn" data-cat="rodina">🏡 Rodina</button>
    <button class="filter-btn" data-cat="prace">💼 Práce</button>
    <button class="filter-btn" data-cat="projekt">🎯 Projekt</button>
  </div>
  <div class="add-card">
    <div class="add-row1">
      <input class="add-input" id="addInput" type="text" placeholder="Přidat nový úkol…" maxlength="120">
    </div>
    <div class="add-row2">
      <select id="addCat">
        <option value="osobni">🧘 Osobní</option>
        <option value="rodina">🏡 Rodina</option>
        <option value="prace">💼 Práce</option>
        <option value="projekt">🎯 Projekt</option>
      </select>
      <select id="addPrio">
        <option value="high">🔴 Vysoká</option>
        <option value="mid" selected>🟡 Střední</option>
        <option value="low">🟢 Nízká</option>
      </select>
      <input type="date" id="addDate">
      <input type="time" id="addTime">
      <button class="btn-add" id="addBtn">+ Přidat</button>
    </div>
  </div>
  <div class="sort-bar">
    <span>Seřadit:</span>
    <select id="sortSel">
      <option value="created">Přidáno</option>
      <option value="date">Termín</option>
      <option value="prio">Priorita</option>
      <option value="cat">Kategorie</option>
    </select>
  </div>
  <div class="tasks" id="taskList"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const STORAGE_KEY = 'moje_ukoly_v2';
const catLabel = { osobni: '🧘 Osobní', rodina: '🏡 Rodina', prace: '💼 Práce', projekt: '🎯 Projekt' };
const prioLabel = { high: '🔴 Vysoká', mid: '🟡 Střední', low: '🟢 Nízká' };
const prioOrder = { high: 0, mid: 1, low: 2 };
let tasks = [], filter = 'all', sort = 'created', notifTimers = {};

function loadTasks() {
  try { const r = localStorage.getItem(STORAGE_KEY); tasks = r ? JSON.parse(r) : getSample(); } catch { tasks = getSample(); }
}
function saveTasks() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {} }
function getSample() {
  const fmt = d => d.toISOString().slice(0,10);
  const today = new Date(), tomorrow = new Date(today), yesterday = new Date(today);
  tomorrow.setDate(today.getDate()+1); yesterday.setDate(today.getDate()-1);
  return [
    { id: 1, title: 'Zavolat zubařovi – domluvit termín', cat: 'osobni', prio: 'high', date: fmt(tomorrow), time: '09:00', done: false, created: Date.now()-5000 },
    { id: 2, title: 'Narozeniny Maminky – koupit dárek', cat: 'rodina', prio: 'high', date: fmt(tomorrow), time: '', done: false, created: Date.now()-4000 },
    { id: 3, title: 'Odeslat fakturu klientovi', cat: 'prace', prio: 'mid', date: fmt(today), time: '14:00', done: false, created: Date.now()-3000 },
    { id: 4, title: 'Přečíst 20 stran knihy', cat: 'osobni', prio: 'low', date: '', time: '', done: false, created: Date.now()-2000 },
    { id: 5, title: 'Naplánovat víkendový výlet', cat: 'rodina', prio: 'mid', date: fmt(yesterday), time: '', done: false, created: Date.now()-1000 },
  ];
}
function getDateStatus(d) {
  if (!d) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const dt = new Date(d); dt.setHours(0,0,0,0);
  return dt < today ? 'overdue' : dt.getTime() === today.getTime() ? 'today' : 'future';
}
function formatDate(d) {
  if (!d) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const dt = new Date(d); dt.setHours(0,0,0,0);
  const diff = Math.round((dt - today) / 86400000);
  if (diff === 0) return '📅 Dnes';
  if (diff === 1) return '📅 Zítra';
  if (diff === -1) return '⚠️ Včera';
  if (diff < 0) return `⚠️ ${Math.abs(diff)} dní zpět`;
  return '📅 ' + dt.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'short' });
}
function scheduleNotif(task) {
  if (notifTimers[task.id]) clearTimeout(notifTimers[task.id]);
  if (!task.date || !task.time || task.done) return;
  const t = new Date(task.date + 'T' + task.time), delay = t - Date.now();
  if (delay > 0 && delay < 86400000*7) {
    notifTimers[task.id] = setTimeout(() => {
      if ('Notification' in window && Notification.permission === 'granted') new Notification('⏰ Připomínka', { body: task.title });
      showToast('⏰ ' + task.title);
    }, delay);
  }
}
function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default')
    Notification.requestPermission().then(p => showToast(p === 'granted' ? '🔔 Upozornění povolena!' : 'Upozornění nebyla povolena.'));
}
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function renderStats() {
  const total = tasks.filter(t => !t.done).length, done = tasks.filter(t => t.done).length;
  const overdue = tasks.filter(t => !t.done && getDateStatus(t.date) === 'overdue').length;
  const catColors = { osobni:'var(--osobni)', rodina:'var(--rodina)', prace:'var(--prace)', projekt:'var(--projekt)' };
  document.getElementById('statsBar').innerHTML =
    `<div class="stat-pill"><span class="stat-dot" style="background:var(--text)"></span>${total} aktivních</div>
     <div class="stat-pill"><span class="stat-dot" style="background:var(--rodina)"></span>${done} splněno</div>
     ${overdue ? `<div class="stat-pill"><span class="stat-dot" style="background:var(--high)"></span>${overdue} po termínu</div>` : ''}
     ${['osobni','rodina','prace','projekt'].map(c => {
       const n = tasks.filter(t => t.cat===c && !t.done).length;
       return n ? `<div class="stat-pill"><span class="stat-dot" style="background:${catColors[c]}"></span>${catLabel[c].split(' ')[1]}: ${n}</div>` : '';
     }).join('')}`;
}
function getSortedFiltered() {
  let list = filter === 'all' ? [...tasks] : tasks.filter(t => t.cat === filter);
  list.sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (sort === 'prio') return prioOrder[a.prio] - prioOrder[b.prio];
    if (sort === 'date') { if (!a.date && !b.date) return 0; if (!a.date) return 1; if (!b.date) return -1; return a.date.localeCompare(b.date); }
    if (sort === 'cat') return a.cat.localeCompare(b.cat);
    return b.created - a.created;
  });
  return list;
}
function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderTasks() {
  renderStats();
  const list = getSortedFiltered(), container = document.getElementById('taskList');
  if (!list.length) { container.innerHTML = '<div class="empty"><div class="empty-icon">✨</div>Žádné úkoly v této kategorii.</div>'; return; }
  container.innerHTML = list.map(task => {
    const ds = getDateStatus(task.date), dc = ds==='overdue'?' overdue':ds==='today'?' today':'';
    const nb = task.time ? `<button class="notif-badge" onclick="scheduleNotif(tasks.find(t=>t.id===${task.id}));showToast('🔔 Připomínka nastavena na ${task.time}')">🔔 ${task.time}</button>` : '';
    return `<div class="task-card${task.done?' done':''}" data-cat="${task.cat}" data-id="${task.id}">
      <div class="task-check${task.done?' checked':''}" onclick="toggleDone(${task.id})"></div>
      <div class="task-body">
        <div class="task-title">${esc(task.title)}</div>
        <div class="task-meta">
          <span class="tag tag-cat-${task.cat}">${catLabel[task.cat]}</span>
          <span class="tag tag-prio-${task.prio}">${prioLabel[task.prio]}</span>
          ${task.date ? `<span class="task-date${dc}">${formatDate(task.date)}</span>` : ''}
          ${nb}
        </div>
      </div>
      <button class="delete-btn" onclick="deleteTask(${task.id})" title="Smazat">&times;</button>
    </div>`;
  }).join('');
}
function toggleDone(id) {
  const t = tasks.find(t=>t.id===id); if (!t) return;
  t.done = !t.done; if (t.done) showToast('✅ Splněno!');
  saveTasks(); renderTasks();
}
function deleteTask(id) {
  tasks = tasks.filter(t=>t.id!==id); if (notifTimers[id]) clearTimeout(notifTimers[id]);
  saveTasks(); renderTasks(); showToast('🗑 Úkol smazán');
}
function addTask() {
  const input = document.getElementById('addInput'), title = input.value.trim();
  if (!title) { input.focus(); return; }
  const task = { id: Date.now(), title, cat: document.getElementById('addCat').value, prio: document.getElementById('addPrio').value, date: document.getElementById('addDate').value, time: document.getElementById('addTime').value, done: false, created: Date.now() };
  tasks.unshift(task); scheduleNotif(task); saveTasks(); renderTasks();
  input.value = ''; document.getElementById('addDate').value = ''; document.getElementById('addTime').value = '';
  showToast('✚ Úkol přidán');
}
document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('cs-CZ', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
document.getElementById('addBtn').onclick = addTask;
document.getElementById('addInput').addEventListener('keydown', e => { if (e.key==='Enter') addTask(); });
document.getElementById('sortSel').onchange = e => { sort = e.target.value; renderTasks(); };
document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); filter = btn.dataset.cat; renderTasks();
}));
if ('Notification' in window && Notification.permission === 'default') setTimeout(requestNotifPermission, 1200);
loadTasks(); tasks.forEach(scheduleNotif); renderTasks();
</script>
</body>
</html>
