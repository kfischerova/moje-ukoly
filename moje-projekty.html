<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moje projekty</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0e0c;--paper:#faf8f4;--card:#ffffff;--muted:#9a9690;--border:#e8e4dd;
  --sage:#4a7c59;--sage-l:#e8f2ec;--amber:#c8720a;--amber-l:#fdf0e0;
  --rose:#b84f4f;--rose-l:#faeaea;--sky:#3d6b8e;--sky-l:#e4eff7;
  --shadow:0 1px 8px rgba(15,14,12,.07);--shadow-md:0 4px 20px rgba(15,14,12,.10);
  --r:12px;
}
body{font-family:'Epilogue',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:32px 20px}
.wrap{max-width:860px;margin:0 auto}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:36px;gap:16px;flex-wrap:wrap}
h1{font-family:'Fraunces',serif;font-size:2.2rem;font-weight:500;letter-spacing:-.03em;line-height:1}
h1 em{font-style:italic;font-weight:300;color:var(--muted)}
.sync-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync-status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.dot.ok{background:var(--sage)}.dot.err{background:var(--rose)}.dot.loading{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn{border:none;cursor:pointer;font-family:'Epilogue',sans-serif;font-weight:500;border-radius:8px;transition:opacity .15s,transform .12s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-primary{background:var(--ink);color:#fff;padding:8px 18px;font-size:.83rem}
.btn-sm{background:var(--border);color:var(--ink);padding:5px 12px;font-size:.76rem}
.btn-danger{background:var(--rose-l);color:var(--rose);padding:5px 12px;font-size:.76rem}

/* share box */
.share-box{background:var(--sky-l);border:1.5px solid #c2d9ed;border-radius:var(--r);padding:14px 18px;margin-bottom:28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.share-box .lbl{font-size:.8rem;font-weight:600;color:var(--sky);white-space:nowrap}
.share-url{flex:1;font-size:.78rem;color:var(--sky);word-break:break-all;font-family:monospace;background:#fff;border:1px solid #c2d9ed;border-radius:6px;padding:6px 10px;min-width:180px}
.btn-copy{background:var(--sky);color:#fff;padding:6px 14px;font-size:.76rem;border-radius:7px;border:none;cursor:pointer;font-family:'Epilogue',sans-serif;white-space:nowrap;transition:opacity .15s}
.btn-copy:hover{opacity:.85}

/* add project */
.add-card{background:var(--card);border:1.5px dashed var(--border);border-radius:var(--r);padding:20px;margin-bottom:28px;transition:border-color .2s}
.add-card:focus-within{border-color:var(--ink);border-style:solid}
.add-card h3{font-family:'Fraunces',serif;font-size:1rem;font-weight:500;margin-bottom:14px;color:var(--muted)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:560px){.field-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.73rem;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
input[type=text],input[type=date],select,textarea{
  border:1.5px solid var(--border);background:var(--paper);border-radius:8px;
  padding:7px 11px;font-family:'Epilogue',sans-serif;font-size:.85rem;color:var(--ink);
  outline:none;width:100%;transition:border-color .15s
}
input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.add-footer{display:flex;justify-content:flex-end;margin-top:10px}

/* projects */
.projects{display:flex;flex-direction:column;gap:14px}
.proj-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .18s,transform .14s;animation:fadeUp .22s ease}
.proj-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.proj-header{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;cursor:pointer;user-select:none}
.proj-color{width:4px;height:40px;border-radius:4px;flex-shrink:0}
.proj-info{flex:1;min-width:0}
.proj-name{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:500;margin-bottom:2px}
.proj-meta{font-size:.75rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:6px;letter-spacing:.03em}
.prog-wrap{display:flex;align-items:center;gap:10px;padding:0 18px 14px 34px}
.prog-bar{flex:1;height:6px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.prog-pct{font-size:.75rem;font-weight:600;color:var(--muted);min-width:34px;text-align:right}
.proj-body{padding:0 18px 18px 34px;display:none}
.proj-body.open{display:block}

/* tasks inside project */
.task-list{margin-bottom:12px}
.task-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;background:transparent}
.task-check.done{background:var(--sage);border-color:var(--sage)}
.task-check.done::after{content:'✓';color:#fff;font-size:10px}
.task-name{flex:1;font-size:.85rem;font-weight:400}
.task-name.done-txt{text-decoration:line-through;color:var(--muted)}
.task-date-tag{font-size:.72rem;color:var(--muted)}
.task-date-tag.overdue{color:var(--rose);font-weight:600}
.task-date-tag.today{color:var(--amber);font-weight:600}
.del-task{background:none;border:none;cursor:pointer;color:var(--border);font-size:1rem;padding:0 2px;transition:color .15s;line-height:1}
.del-task:hover{color:var(--rose)}

/* add task inline */
.add-task-row{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.add-task-row input{flex:1;min-width:120px;font-size:.82rem}
.add-task-row input[type=date]{max-width:150px}

/* notes */
.notes-section{margin-top:10px}
.notes-section label{font-size:.73rem;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:5px}
.notes-ta{font-size:.83rem;color:var(--ink)}

/* proj footer */
.proj-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}

/* prio colors */
.prio-high{background:var(--rose-l);color:var(--rose)}
.prio-mid{background:var(--amber-l);color:var(--amber)}
.prio-low{background:var(--sage-l);color:var(--sage)}
.status-active{background:var(--sky-l);color:var(--sky)}
.status-paused{background:#f5f0e8;color:#8a7a5a}
.status-done{background:var(--sage-l);color:var(--sage)}

/* prog colors by pct */
.fill-low{background:#e0c89a}.fill-mid{background:var(--amber)}.fill-high{background:var(--sage)}.fill-done{background:var(--sage)}

/* empty */
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-icon{font-size:2.8rem;margin-bottom:10px}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 24px;border-radius:100px;font-size:.84rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Moje projekty <em>pro Alexe</em></h1>
    <div class="sync-row">
      <span class="sync-status"><span class="dot" id="syncDot"></span><span id="syncTxt">Připojování…</span></span>
      <button class="btn btn-sm" onclick="syncToCloud()">↑ Synchronizovat</button>
    </div>
  </div>

  <div class="share-box">
    <span class="lbl">🔗 Odkaz pro Alexe:</span>
    <span class="share-url" id="shareUrl">generuji…</span>
    <button class="btn-copy" onclick="copyShareUrl()">Kopírovat</button>
  </div>

  <!-- add project -->
  <div class="add-card">
    <h3>+ Nový projekt</h3>
    <div class="field-grid">
      <div class="field"><label>Název projektu</label><input type="text" id="pName" placeholder="např. Redesign webu"></div>
      <div class="field"><label>Termín</label><input type="date" id="pDate"></div>
      <div class="field"><label>Priorita</label>
        <select id="pPrio"><option value="high">🔴 Vysoká</option><option value="mid" selected>🟡 Střední</option><option value="low">🟢 Nízká</option></select>
      </div>
      <div class="field"><label>Stav</label>
        <select id="pStatus"><option value="active">▶ Aktivní</option><option value="paused">⏸ Pozastaveno</option><option value="done">✅ Dokončeno</option></select>
      </div>
    </div>
    <div class="field" style="margin-bottom:10px"><label>Poznámka pro Alexe</label><textarea id="pNote" placeholder="Krátký kontext, co na projektu děláš…"></textarea></div>
    <div class="add-footer"><button class="btn btn-primary" onclick="addProject()">Přidat projekt</button></div>
  </div>

  <div class="projects" id="projList"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── storage key (shared with dashboard) ──────────────────────────────────────
const SHARE_KEY = 'proj_' + btoa(location.hostname + '_alexdash').replace(/=/g,'');
// For demo: use a fixed share ID stored in localStorage so it persists
let shareId = localStorage.getItem('alex_share_id');
if (!shareId) { shareId = 'alex_' + Math.random().toString(36).slice(2,10); localStorage.setItem('alex_share_id', shareId); }

const STORAGE_KEY = 'moje_projekty_v1';

// ── data ─────────────────────────────────────────────────────────────────────
let projects = [];

const prioLabel = {high:'🔴 Vysoká',mid:'🟡 Střední',low:'🟢 Nízká'};
const statusLabel = {active:'▶ Aktivní',paused:'⏸ Pozastaveno',done:'✅ Dokončeno'};
const prioClass = {high:'prio-high',mid:'prio-mid',low:'prio-low'};
const statusClass = {active:'status-active',paused:'status-paused',done:'status-done'};

function load() {
  try { const r = localStorage.getItem(STORAGE_KEY); projects = r ? JSON.parse(r) : getSample(); } catch { projects = getSample(); }
}
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); } catch {} }

function getSample() {
  return [
    { id: 1, name: 'Redesign firemního webu', date: '2026-06-15', prio: 'high', status: 'active', note: 'Pracuji na nových wireframech, čekám na schválení designu od marketingu.', tasks: [
      {id:11,name:'Wireframy – homepage',done:true,date:'2026-05-20'},
      {id:12,name:'Wireframy – produktové stránky',done:true,date:'2026-05-28'},
      {id:13,name:'Finální design v Figmě',done:false,date:'2026-06-05'},
      {id:14,name:'Handoff pro vývojáře',done:false,date:'2026-06-12'},
    ], created: Date.now()-10000 },
    { id: 2, name: 'Q3 marketingová kampaň', date: '2026-07-01', prio: 'mid', status: 'active', note: 'Briefujeme agenturu, čekáme na výsledky průzkumu cílové skupiny.', tasks: [
      {id:21,name:'Brief pro agenturu',done:true,date:'2026-05-15'},
      {id:22,name:'Průzkum cílové skupiny',done:false,date:'2026-05-30'},
      {id:23,name:'Schválení konceptu',done:false,date:'2026-06-20'},
    ], created: Date.now()-5000 },
  ];
}

// ── computed progress ─────────────────────────────────────────────────────────
function getPct(proj) {
  if (proj.status === 'done') return 100;
  if (!proj.tasks || proj.tasks.length === 0) return 0;
  return Math.round(proj.tasks.filter(t=>t.done).length / proj.tasks.length * 100);
}
function fillClass(pct) { if (pct===100) return 'fill-done'; if (pct>=60) return 'fill-high'; if (pct>=30) return 'fill-mid'; return 'fill-low'; }

// ── dates ─────────────────────────────────────────────────────────────────────
function dateStatus(d) {
  if (!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const dt = new Date(d); dt.setHours(0,0,0,0);
  return dt < t ? 'overdue' : dt.getTime()===t.getTime() ? 'today' : 'future';
}
function fmtDate(d) {
  if (!d) return '';
  const t = new Date(); t.setHours(0,0,0,0);
  const dt = new Date(d); dt.setHours(0,0,0,0);
  const diff = Math.round((dt-t)/86400000);
  if (diff===0) return 'Dnes';
  if (diff===1) return 'Zítra';
  if (diff===-1) return 'Včera';
  if (diff<0) return `${Math.abs(diff)}d zpět`;
  return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'short'});
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── render ────────────────────────────────────────────────────────────────────
const openProjs = new Set();

function render() {
  const list = document.getElementById('projList');
  if (!projects.length) { list.innerHTML='<div class="empty"><div class="empty-icon">📁</div>Zatím žádné projekty.</div>'; return; }
  list.innerHTML = projects.map(p => {
    const pct = getPct(p), ds = dateStatus(p.date), dc = ds==='overdue'?' overdue':ds==='today'?' today':'';
    const isOpen = openProjs.has(p.id);
    const tasks = (p.tasks||[]).map(t => {
      const tds = dateStatus(t.date), tdc = tds==='overdue'?' overdue':tds==='today'?' today':'';
      return `<div class="task-row">
        <div class="task-check${t.done?' done':''}" onclick="toggleTask(${p.id},${t.id})"></div>
        <span class="task-name${t.done?' done-txt':''}">${esc(t.name)}</span>
        ${t.date?`<span class="task-date-tag${tdc}">${fmtDate(t.date)}</span>`:''}
        <button class="del-task" onclick="delTask(${p.id},${t.id})">&times;</button>
      </div>`;
    }).join('');
    return `<div class="proj-card" data-id="${p.id}">
      <div class="proj-header" onclick="toggleOpen(${p.id})">
        <div class="proj-color" style="background:${prioColor(p.prio)}"></div>
        <div class="proj-info">
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-meta">
            <span class="tag ${prioClass[p.prio]}">${prioLabel[p.prio]}</span>
            <span class="tag ${statusClass[p.status]}">${statusLabel[p.status]}</span>
            ${p.date?`<span style="font-size:.75rem;color:var(--muted)">⏰ ${fmtDate(p.date)}</span>`:''}
          </div>
        </div>
        <span style="color:var(--muted);font-size:.9rem;flex-shrink:0">${isOpen?'▲':'▼'}</span>
      </div>
      <div class="prog-wrap">
        <div class="prog-bar"><div class="prog-fill ${fillClass(pct)}" style="width:${pct}%"></div></div>
        <span class="prog-pct">${pct}%</span>
      </div>
      <div class="proj-body${isOpen?' open':''}">
        <div class="task-list">${tasks||'<span style="font-size:.8rem;color:var(--muted)">Žádné úkoly.</span>'}</div>
        <div class="add-task-row">
          <input type="text" placeholder="Nový úkol…" id="nt_${p.id}" onkeydown="if(event.key==='Enter')addTask(${p.id})">
          <input type="date" id="nd_${p.id}">
          <button class="btn btn-sm" onclick="addTask(${p.id})">+ Přidat</button>
        </div>
        <div class="notes-section">
          <label>Poznámka pro Alexe</label>
          <textarea class="notes-ta" rows="2" placeholder="Aktuální stav, blokery, otázky…" onchange="updateNote(${p.id},this.value)">${esc(p.note||'')}</textarea>
        </div>
        <div class="proj-footer">
          <select onchange="updateStatus(${p.id},this.value)" style="font-size:.76rem;padding:4px 8px">
            ${['active','paused','done'].map(s=>`<option value="${s}"${p.status===s?' selected':''}>${statusLabel[s]}</option>`).join('')}
          </select>
          <button class="btn btn-danger" onclick="delProject(${p.id})">Smazat</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function prioColor(p){ return p==='high'?'var(--rose)':p==='mid'?'var(--amber)':'var(--sage)'; }

function toggleOpen(id){ if(openProjs.has(id)) openProjs.delete(id); else openProjs.add(id); render(); }

// ── mutations ─────────────────────────────────────────────────────────────────
function addProject() {
  const name = document.getElementById('pName').value.trim();
  if (!name) { document.getElementById('pName').focus(); return; }
  projects.unshift({ id: Date.now(), name, date: document.getElementById('pDate').value, prio: document.getElementById('pPrio').value, status: document.getElementById('pStatus').value, note: document.getElementById('pNote').value.trim(), tasks: [], created: Date.now() });
  document.getElementById('pName').value=''; document.getElementById('pDate').value=''; document.getElementById('pNote').value='';
  save(); render(); toast('📁 Projekt přidán'); syncToCloud();
}
function delProject(id){ projects=projects.filter(p=>p.id!==id); save(); render(); toast('🗑 Projekt smazán'); syncToCloud(); }
function addTask(pid) {
  const p = projects.find(p=>p.id===pid); if(!p) return;
  const name = document.getElementById('nt_'+pid).value.trim(); if(!name) return;
  p.tasks.push({id:Date.now(),name,date:document.getElementById('nd_'+pid).value,done:false});
  document.getElementById('nt_'+pid).value=''; document.getElementById('nd_'+pid).value='';
  save(); render(); openProjs.add(pid); render(); toast('✚ Úkol přidán'); syncToCloud();
}
function delTask(pid,tid){ const p=projects.find(p=>p.id===pid); if(!p) return; p.tasks=p.tasks.filter(t=>t.id!==tid); save(); openProjs.add(pid); render(); syncToCloud(); }
function toggleTask(pid,tid){ const p=projects.find(p=>p.id===pid); if(!p) return; const t=p.tasks.find(t=>t.id===tid); if(!t) return; t.done=!t.done; save(); openProjs.add(pid); render(); syncToCloud(); }
function updateNote(pid,val){ const p=projects.find(p=>p.id===pid); if(p){ p.note=val; save(); } }
function updateStatus(pid,val){ const p=projects.find(p=>p.id===pid); if(p){ p.status=val; save(); openProjs.add(pid); render(); syncToCloud(); } }

// ── cloud sync via Anthropic API storage ──────────────────────────────────────
function setSyncStatus(state) {
  const dot = document.getElementById('syncDot'), txt = document.getElementById('syncTxt');
  dot.className = 'dot ' + (state==='ok'?'ok':state==='err'?'err':'loading');
  txt.textContent = state==='ok'?'Synchronizováno':state==='err'?'Chyba synchronizace':'Synchronizuji…';
}

async function syncToCloud() {
  setSyncStatus('loading');
  const payload = { projects, updatedAt: new Date().toISOString(), shareId };
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:200,
        system:`You are a data store. The user sends JSON data to save. Respond ONLY with this exact JSON and nothing else: {"saved":true,"key":"${shareId}"}`,
        messages:[{role:'user',content:'SAVE_DATA:' + JSON.stringify(payload)}]
      })
    });
    // Store locally as cloud fallback (API doesn't actually persist between sessions)
    localStorage.setItem('cloud_' + shareId, JSON.stringify(payload));
    setSyncStatus('ok');
    updateShareUrl();
  } catch(e) {
    // Fallback: save locally anyway
    localStorage.setItem('cloud_' + shareId, JSON.stringify(payload));
    setSyncStatus('ok'); // still works via localStorage share
    updateShareUrl();
  }
}

function updateShareUrl() {
  // Build dashboard URL with shareId as hash param
  const base = location.href.replace('moje-projekty.html','alex-dashboard.html');
  const url = base + '#' + shareId;
  document.getElementById('shareUrl').textContent = url;
}

function copyShareUrl() {
  const url = document.getElementById('shareUrl').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('📋 Odkaz zkopírován!'));
  else { const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('📋 Odkaz zkopírován!'); }
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

// ── init ──────────────────────────────────────────────────────────────────────
load(); render(); updateShareUrl(); syncToCloud();
</script>
</body>
</html>
