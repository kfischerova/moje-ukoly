<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0e0c;--paper:#0d1117;--card:#161b22;--card2:#1c2330;
  --muted:#7d8590;--border:#30363d;
  --sage:#3fb950;--sage-d:#1a4526;
  --amber:#d29922;--amber-d:#3d2f0c;
  --rose:#f85149;--rose-d:#3d1414;
  --sky:#58a6ff;--sky-d:#0d2840;
  --shadow:0 1px 8px rgba(0,0,0,.3);--shadow-md:0 4px 24px rgba(0,0,0,.4);
  --r:12px;
}
body{font-family:'Epilogue',sans-serif;background:var(--paper);color:#e6edf3;min-height:100vh;padding:36px 20px}
.wrap{max-width:900px;margin:0 auto}

/* header */
.top{margin-bottom:40px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px}
h1{font-family:'Fraunces',serif;font-size:2.4rem;font-weight:500;letter-spacing:-.03em;line-height:1;color:#f0f6fc}
h1 span{font-style:italic;font-weight:300;color:var(--muted)}
.updated{font-size:.77rem;color:var(--muted)}
.refresh-btn{background:var(--card2);color:#e6edf3;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-family:'Epilogue',sans-serif;font-size:.78rem;cursor:pointer;transition:background .15s}
.refresh-btn:hover{background:var(--border)}

/* summary cards */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:32px}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.sum-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sum-card.c-total::before{background:linear-gradient(90deg,var(--sky),#388bfd)}
.sum-card.c-active::before{background:linear-gradient(90deg,var(--amber),#e3b341)}
.sum-card.c-done::before{background:linear-gradient(90deg,var(--sage),#2ea043)}
.sum-card.c-overdue::before{background:linear-gradient(90deg,var(--rose),#da3633)}
.sum-num{font-family:'Fraunces',serif;font-size:2.2rem;font-weight:700;color:#f0f6fc;line-height:1;margin-bottom:4px}
.sum-lbl{font-size:.75rem;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}

/* projects */
.section-title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:500;color:#f0f6fc;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.projects{display:flex;flex-direction:column;gap:14px;margin-bottom:40px}

.proj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .18s,transform .14s;animation:fadeUp .25s ease}
.proj-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.proj-top{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 12px;cursor:pointer;user-select:none}
.prio-stripe{width:4px;border-radius:4px;flex-shrink:0;margin-top:3px;height:44px}
.proj-info{flex:1;min-width:0}
.proj-name{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:500;color:#f0f6fc;margin-bottom:5px}
.proj-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:6px;letter-spacing:.03em}
.tag-high{background:var(--rose-d);color:var(--rose)}
.tag-mid{background:var(--amber-d);color:var(--amber)}
.tag-low{background:var(--sage-d);color:var(--sage)}
.tag-active{background:var(--sky-d);color:var(--sky)}
.tag-paused{background:#21262d;color:var(--muted)}
.tag-done{background:var(--sage-d);color:var(--sage)}
.tag-deadline{font-size:.72rem;color:var(--muted)}
.tag-deadline.overdue{color:var(--rose)}
.tag-deadline.today{color:var(--amber)}

.pct-badge{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pct-num{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:#f0f6fc;line-height:1}
.pct-lbl{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.prog-wrap{padding:0 20px 14px 38px}
.prog-bar{height:5px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.fill-0{background:#30363d}
.fill-low{background:#5a3e1b}
.fill-mid{background:var(--amber)}
.fill-high{background:var(--sage)}
.fill-done{background:var(--sage)}

/* expandable body */
.proj-body{padding:0 20px 18px 38px;display:none;border-top:1px solid var(--border);padding-top:14px}
.proj-body.open{display:block}
.sub-title{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}

/* task list */
.task-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #21262d}
.task-row:last-child{border-bottom:none}
.t-check{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.t-check.done{background:var(--sage-d);border-color:var(--sage)}
.t-check.done::after{content:'✓';color:var(--sage);font-size:9px}
.t-name{flex:1;font-size:.83rem;color:#e6edf3}
.t-name.done-txt{text-decoration:line-through;color:var(--muted)}
.t-date{font-size:.72rem;color:var(--muted)}
.t-date.overdue{color:var(--rose)}
.t-date.today{color:var(--amber)}

/* notes */
.note-box{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:.84rem;color:#c9d1d9;line-height:1.55;white-space:pre-wrap;margin-top:12px}
.note-box em{font-size:.75rem;color:var(--muted);font-style:normal}

/* chevron */
.chevron{color:var(--muted);font-size:.85rem;flex-shrink:0}

/* no data */
.no-data{text-align:center;padding:60px 20px;color:var(--muted)}
.no-data-icon{font-size:3rem;margin-bottom:12px}

/* loading */
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:.9rem}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--sky);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e6edf3;color:var(--ink);padding:10px 24px;border-radius:100px;font-size:.84rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-row">
      <h1>Přehled projektů <span>— Alex</span></h1>
      <button class="refresh-btn" onclick="loadData()">↻ Obnovit</button>
    </div>
    <div class="updated" id="updatedLbl">Načítám data…</div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="section-title">📁 Aktivní projekty</div>
  <div class="projects" id="activeList"></div>

  <div class="section-title">✅ Dokončené projekty</div>
  <div class="projects" id="doneList"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── get shareId from URL hash ─────────────────────────────────────────────────
let shareId = location.hash.replace('#','') || null;
const openCards = new Set();

const prioLabel = {high:'🔴 Vysoká',mid:'🟡 Střední',low:'🟢 Nízká'};
const statusLabel = {active:'Aktivní',paused:'Pozastaveno',done:'Dokončeno'};

// ── helpers ──────────────────────────────────────────────────────────────────
function dateStatus(d) {
  if (!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const dt = new Date(d); dt.setHours(0,0,0,0);
  return dt < t ? 'overdue' : dt.getTime()===t.getTime() ? 'today' : 'future';
}
function fmtDate(d) {
  if (!d) return '';
  const t = new Date(); t.setHours(0,0,0,0);
  const dt = new Date(d); dt.setHours(0,0,0,0);
  const diff = Math.round((dt-t)/86400000);
  if (diff===0) return 'Dnes';
  if (diff===1) return 'Zítra';
  if (diff<0) return `${Math.abs(diff)}d po termínu`;
  return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'short'});
}
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getPct(p) {
  if (p.status==='done') return 100;
  if (!p.tasks || !p.tasks.length) return 0;
  return Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100);
}
function fillClass(pct){ if(pct===100) return 'fill-done'; if(pct>=60) return 'fill-high'; if(pct>=30) return 'fill-mid'; if(pct>0) return 'fill-low'; return 'fill-0'; }
function prioStripe(p){ return p==='high'?'var(--rose)':p==='mid'?'var(--amber)':'var(--sage)'; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

// ── load ─────────────────────────────────────────────────────────────────────
function loadData() {
  document.getElementById('activeList').innerHTML = '<div class="loading"><div class="spinner"></div>Načítám projekty…</div>';
  document.getElementById('doneList').innerHTML = '';
  document.getElementById('summary').innerHTML = '';

  // Try to load from shared localStorage key (same browser/device) or from cloud_ key
  let data = null;
  if (shareId) {
    try { const r = localStorage.getItem('cloud_' + shareId); if (r) data = JSON.parse(r); } catch {}
  }
  // Fallback: try any cloud_ key
  if (!data) {
    for (let i=0;i<localStorage.length;i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('cloud_')) { try { data = JSON.parse(localStorage.getItem(k)); break; } catch {} }
    }
  }
  // Fallback: try direct project storage
  if (!data) {
    try { const r = localStorage.getItem('moje_projekty_v1'); if (r) data = {projects: JSON.parse(r), updatedAt: null}; } catch {}
  }

  if (!data || !data.projects) {
    showNoData();
    return;
  }
  renderDashboard(data);
}

function showNoData() {
  document.getElementById('updatedLbl').textContent = 'Data nejsou k dispozici';
  document.getElementById('activeList').innerHTML = `<div class="no-data"><div class="no-data-icon">📭</div>
    <p>Data zatím nejsou k dispozici.</p>
    <p style="margin-top:8px;font-size:.8rem">Ujistěte se, že máte správný odkaz, nebo požádejte kolegyni o sdílení.</p>
  </div>`;
  document.getElementById('doneList').innerHTML = '';
}

function renderDashboard(data) {
  const projects = data.projects || [];
  const updatedAt = data.updatedAt ? new Date(data.updatedAt).toLocaleString('cs-CZ') : '—';
  document.getElementById('updatedLbl').textContent = `Poslední aktualizace: ${updatedAt}`;

  // Summary
  const total = projects.length;
  const active = projects.filter(p=>p.status==='active').length;
  const done = projects.filter(p=>p.status==='done').length;
  const overdue = projects.filter(p=>p.status!=='done' && dateStatus(p.date)==='overdue').length;
  const avgPct = total ? Math.round(projects.reduce((s,p)=>s+getPct(p),0)/total) : 0;
  document.getElementById('summary').innerHTML = `
    <div class="sum-card c-total"><div class="sum-num">${total}</div><div class="sum-lbl">Projektů celkem</div></div>
    <div class="sum-card c-active"><div class="sum-num">${active}</div><div class="sum-lbl">Aktivních</div></div>
    <div class="sum-card c-done"><div class="sum-num">${avgPct}%</div><div class="sum-lbl">Průměrný progres</div></div>
    <div class="sum-card c-overdue"><div class="sum-num">${overdue}</div><div class="sum-lbl">Po termínu</div></div>
  `;

  const active_projs = projects.filter(p=>p.status!=='done');
  const done_projs = projects.filter(p=>p.status==='done');

  document.getElementById('activeList').innerHTML = active_projs.length ? renderProjects(active_projs) : '<div class="no-data" style="padding:24px"><div class="no-data-icon">✨</div>Žádné aktivní projekty.</div>';
  document.getElementById('doneList').innerHTML = done_projs.length ? renderProjects(done_projs) : '<div style="color:var(--muted);font-size:.85rem;padding:8px 0">Zatím žádné dokončené projekty.</div>';
}

function renderProjects(list) {
  return list.map(p => {
    const pct = getPct(p), ds = dateStatus(p.date), dc = ds==='overdue'?' overdue':ds==='today'?' today':'';
    const isOpen = openCards.has(p.id);
    const tasks = (p.tasks||[]).map(t => {
      const tds = dateStatus(t.date), tdc = tds==='overdue'?' overdue':tds==='today'?' today':'';
      return `<div class="task-row">
        <div class="t-check${t.done?' done':''}"></div>
        <span class="t-name${t.done?' done-txt':''}">${esc(t.name)}</span>
        ${t.date?`<span class="t-date${tdc}">${fmtDate(t.date)}</span>`:''}
      </div>`;
    }).join('');
    return `<div class="proj-card" data-id="${p.id}">
      <div class="proj-top" onclick="toggleCard(${p.id})">
        <div class="prio-stripe" style="background:${prioStripe(p.prio)}"></div>
        <div class="proj-info">
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-tags">
            <span class="tag tag-${p.prio}">${prioLabel[p.prio]}</span>
            <span class="tag tag-${p.status}">${statusLabel[p.status]}</span>
            ${p.date?`<span class="tag-deadline${dc}">⏰ ${fmtDate(p.date)}</span>`:''}
          </div>
        </div>
        <div class="pct-badge">
          <span class="pct-num">${pct}%</span>
          <span class="pct-lbl">hotovo</span>
        </div>
        <span class="chevron">${isOpen?'▲':'▼'}</span>
      </div>
      <div class="prog-wrap">
        <div class="prog-bar"><div class="prog-fill ${fillClass(pct)}" style="width:${pct}%"></div></div>
      </div>
      <div class="proj-body${isOpen?' open':''}">
        ${tasks?`<div class="sub-title">Úkoly</div><div>${tasks}</div>`:''}
        ${p.note?`<div class="sub-title" style="margin-top:12px">Poznámka</div><div class="note-box">${esc(p.note)}</div>`:''}
        ${!tasks && !p.note?'<span style="font-size:.82rem;color:var(--muted)">Žádné detaily.</span>':''}
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id) { if(openCards.has(id)) openCards.delete(id); else openCards.add(id); rerender(); }

function rerender() {
  // re-render without re-fetching
  document.querySelectorAll('.proj-card').forEach(card => {
    const id = parseInt(card.dataset.id);
    const body = card.querySelector('.proj-body');
    const chevron = card.querySelector('.chevron');
    if (body) body.classList.toggle('open', openCards.has(id));
    if (chevron) chevron.textContent = openCards.has(id)?'▲':'▼';
  });
}

// auto-refresh every 30s
setInterval(loadData, 30000);
loadData();
</script>
</body>
</html>
