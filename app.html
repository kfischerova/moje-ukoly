<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Úkoly">
<meta name="theme-color" content="#F2F2F7">
<title>Úkoly</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;
  --ink:#1C1C1E;--ink2:#3A3A3C;--muted:#8E8E93;--border:rgba(60,60,67,.12);
  --osobni:#FF6B35;--rodina:#30D158;--prace:#0A84FF;
  --high:#FF3B30;--mid:#FF9F0A;--low:#30D158;
  --r:13px;--r-lg:18px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
.layout{display:flex;min-height:100vh}
.sidebar{width:256px;flex-shrink:0;background:rgba(255,255,255,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);padding:20px 0 24px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.main{flex:1;padding:40px 32px;max-width:780px}
.sb-logo{padding:4px 20px 20px;font-size:1.3rem;font-weight:700;letter-spacing:-.02em;border-bottom:1px solid var(--border);margin-bottom:8px}
.sb-logo span{display:block;font-size:.7rem;font-weight:400;color:var(--muted);margin-top:2px;letter-spacing:0}
.sb-group{padding:4px 0}
.sb-lbl{font-size:.67rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 20px 4px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 20px;cursor:pointer;font-size:.87rem;font-weight:500;color:var(--ink2);transition:background .1s;user-select:none}
.sb-item:hover{background:rgba(0,0,0,.04)}
.sb-item.active{color:var(--ink);background:rgba(0,0,0,.05);font-weight:600}
.sb-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.sb-cnt{margin-left:auto;font-size:.74rem;font-weight:600;color:var(--muted)}
.sb-spacer{flex:1}
.sb-footer{padding:14px 20px 0;border-top:1px solid var(--border)}
.sb-flink{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);cursor:pointer;padding:7px 0;background:none;border:none;font-family:inherit;width:100%;text-align:left;transition:color .15s}
.sb-flink:hover{color:var(--ink)}
/* main */
.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:12px}
.page-title{font-size:1.85rem;font-weight:700;letter-spacing:-.03em}
.btn-add{background:var(--prace);color:#fff;border:none;border-radius:100px;padding:8px 18px;font-size:.85rem;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px;transition:opacity .15s,transform .12s;box-shadow:0 2px 8px rgba(10,132,255,.3)}
.btn-add:hover{opacity:.88;transform:translateY(-1px)}
.btn-add:active{transform:scale(.97)}
/* add panel */
.add-panel{background:var(--card);border-radius:var(--r-lg);padding:20px;margin-bottom:20px;box-shadow:var(--shadow-md);display:none;animation:panelIn .18s ease}
.add-panel.open{display:block}
@keyframes panelIn{from{opacity:0;transform:translateY(-6px) scale(.99)}to{opacity:1;transform:none}}
.add-lbl{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.fg{display:grid;gap:10px;margin-bottom:10px}
.fg2{grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:580px){.fg2,.fg3{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:.71rem;font-weight:500;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.87rem;color:var(--ink);outline:none;width:100%;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--prace);box-shadow:0 0 0 3px rgba(10,132,255,.1)}
.proj-row{display:none;margin-bottom:10px}
.proj-row.on{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:580px){.proj-row.on{grid-template-columns:1fr}}
.share-row{display:none;margin-bottom:10px;flex-direction:column;gap:5px}
.share-row.on{display:flex}
.share-hint{font-size:.74rem;color:var(--muted);padding-left:1px}
.add-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:10px;padding:8px 18px;font-size:.84rem;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--prace);color:#fff;box-shadow:0 2px 8px rgba(10,132,255,.22)}
.btn-g{background:var(--bg);color:var(--muted)}
/* share panel */
.share-panel{background:var(--card);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow);display:none}
.share-panel.on{display:block}
.sp-hd{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.sp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sp-row:last-child{border-bottom:none;padding-bottom:0}
.sp-name{font-size:.86rem;font-weight:500;min-width:80px}
.sp-url{flex:1;font-size:.73rem;color:var(--muted);font-family:'SF Mono',ui-monospace,monospace;background:var(--bg);border-radius:8px;padding:5px 9px;word-break:break-all;min-width:140px}
.btn-cp{background:var(--prace);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:.74rem;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn-cp:hover{opacity:.85}
/* tasks */
.task-group{background:var(--card);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:10px}
.task-card{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);transition:background .1s;animation:tIn .16s ease;position:relative}
.task-card:last-child{border-bottom:none}
.task-card:hover{background:rgba(0,0,0,.015)}
.task-card.done{opacity:.4}
.task-card.done .ttl{text-decoration:line-through;color:var(--muted)}
@keyframes tIn{from{opacity:0;transform:translateX(-3px)}to{opacity:1;transform:none}}
.chk{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:2px solid var(--border);cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:transparent}
.chk:hover{border-color:var(--prace)}
.chk.on{background:var(--rodina);border-color:var(--rodina)}
.chk.on::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.tbody{flex:1;min-width:0}
.ttl{font-size:.91rem;font-weight:500;color:var(--ink);margin-bottom:5px;line-height:1.35}
.meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;font-size:.71rem;font-weight:500;border-radius:100px;padding:2px 9px;white-space:nowrap}
.c-osobni{background:rgba(255,107,53,.12);color:var(--osobni)}
.c-rodina{background:rgba(48,209,88,.12);color:var(--rodina)}
.c-prace{background:rgba(10,132,255,.12);color:var(--prace)}
.c-high{background:rgba(255,59,48,.1);color:var(--high)}
.c-mid{background:rgba(255,159,10,.1);color:var(--mid)}
.c-low{background:rgba(48,209,88,.1);color:var(--low)}
.c-proj{background:rgba(94,92,230,.1);color:#5E5CE6}
.c-share{background:rgba(10,132,255,.07);color:var(--prace);cursor:pointer}
.c-share:hover{background:rgba(10,132,255,.16)}
.c-priv{background:rgba(142,142,147,.1);color:var(--muted)}
.tdate{font-size:.74rem;color:var(--muted)}
.tdate.ov{color:var(--high);font-weight:600}
.tdate.td{color:var(--mid);font-weight:600}
.xbtn{background:none;border:none;cursor:pointer;color:transparent;font-size:1.05rem;padding:2px 4px;transition:color .15s;flex-shrink:0;line-height:1}
.task-card:hover .xbtn{color:var(--muted)}
.xbtn:hover{color:var(--high)!important}
.calbtn{background:none;border:none;cursor:pointer;color:transparent;font-size:.9rem;padding:2px 4px;transition:color .15s;flex-shrink:0;line-height:1;text-decoration:none}
.task-card:hover .calbtn{color:var(--muted)}
.calbtn:hover{color:var(--prace)!important}
/* subtasks */
.subtasks{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.subtask-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(60,60,67,.06)}
.subtask-row:last-of-type{border-bottom:none}
.sub-chk{width:16px;height:16px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;background:transparent}
.sub-chk:hover{border-color:var(--prace)}
.sub-chk.on{background:var(--rodina);border-color:var(--rodina)}
.sub-chk.on::after{content:'✓';color:#fff;font-size:9px;font-weight:700}
.sub-name{flex:1;font-size:.82rem;color:var(--ink2)}
.sub-name.done{text-decoration:line-through;color:var(--muted)}
.sub-del{background:none;border:none;cursor:pointer;color:transparent;font-size:.9rem;padding:1px 3px;line-height:1;transition:color .15s}
.subtask-row:hover .sub-del{color:var(--muted)}
.sub-del:hover{color:var(--high)!important}
.sub-add-row{display:flex;gap:6px;margin-top:8px}
.sub-add-row input{flex:1;font-size:.82rem;padding:6px 10px;border-radius:8px}
.sub-add-btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:.78rem;font-weight:600;font-family:inherit;cursor:pointer;color:var(--muted);white-space:nowrap;transition:background .15s}
.sub-add-btn:hover{background:var(--border)}
.sub-toggle{background:none;border:none;cursor:pointer;font-size:.72rem;color:var(--muted);padding:2px 4px;font-family:inherit;transition:color .15s;display:flex;align-items:center;gap:3px;margin-top:2px}
.sub-toggle:hover{color:var(--prace)}
.done-div{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:20px 0 8px;display:flex;align-items:center;gap:8px}
.done-div::after{content:'';flex:1;height:1px;background:var(--border)}
.proj-grid{display:flex;flex-direction:column;gap:10px}
.proj-card{background:var(--card);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--prace);transition:box-shadow .15s,transform .12s;animation:panelIn .18s ease}
.proj-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.proj-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.proj-card-info{flex:1;min-width:0}
.proj-card-name{font-size:1rem;font-weight:600;letter-spacing:-.01em;margin-bottom:4px}
.proj-card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.proj-card-note{font-size:.79rem;color:var(--muted);margin-top:6px;line-height:1.45;font-style:italic}
.prog-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog-track{flex:1;height:4px;background:var(--bg);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.prog-pct{font-size:.73rem;font-weight:600;color:var(--muted);min-width:30px;text-align:right}
.proj-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .15s}
.proj-card:hover .proj-actions{opacity:1}
.pabtn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.88rem;padding:2px 5px;transition:color .15s;line-height:1}
.pabtn:hover{color:var(--high)}
.pabtn-archive{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.88rem;padding:2px 5px;transition:color .15s;line-height:1}
.pabtn-archive:hover{color:var(--mid)}
.chip-status-archived{background:rgba(142,142,147,.1);color:var(--muted)}
.chip-status-active{background:rgba(10,132,255,.1);color:var(--prace)}
.chip-status-paused{background:rgba(142,142,147,.1);color:var(--muted)}
.chip-status-done{background:rgba(48,209,88,.1);color:var(--rodina)}
.empty{background:var(--card);border-radius:var(--r-lg);text-align:center;padding:56px 20px;color:var(--muted);box-shadow:var(--shadow)}
.empty-ico{font-size:2.6rem;margin-bottom:10px;display:block}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;padding:10px 22px;border-radius:100px;font-size:.83rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .22s;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}
.mob-bar{display:none;background:rgba(242,242,247,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.mob-logo{font-size:1.05rem;font-weight:700}
.mob-menu{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--ink);padding:4px 8px}
/* bottom nav for mobile */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(242,242,247,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));flex-direction:row;justify-content:space-around}
.mob-nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;font-family:inherit;font-size:.62rem;font-weight:500;color:var(--muted);cursor:pointer;padding:4px 12px;min-width:56px;transition:color .15s}
.mob-nav-btn.active{color:var(--prace)}
.mob-nav-btn span{font-size:1.3rem;line-height:1}
@media(max-width:700px){
  .sidebar{display:none;position:fixed;top:0;left:0;height:100vh;z-index:200;width:82%;max-width:300px;box-shadow:var(--shadow-md)}
  .sidebar.open{display:flex}
  .mob-bar{display:flex}
  .mob-nav{display:flex}
  .main{padding:16px 14px;padding-bottom:80px}
  .page-hd{margin-bottom:16px}
  .page-title{font-size:1.5rem}
  .btn-add{padding:8px 14px;font-size:.82rem}
  .task-card{padding:12px 14px}
  .ttl{font-size:.9rem}
  .chip{font-size:.68rem;padding:2px 7px}
  .add-panel{padding:16px 14px}
  .fg2{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr 1fr}
  input[type=text],input[type=date],input[type=time],select{font-size:16px;padding:10px 12px}
  .add-ft{flex-direction:row}
  .btn{padding:10px 18px;font-size:.87rem}
  .proj-card{padding:14px}
  .task-check,.chk{width:24px;height:24px}
  .chk.on::after{font-size:13px}
  /* always show delete/cal buttons on mobile */
  .proj-actions{opacity:1}
  .xbtn,.calbtn{opacity:1;color:var(--muted)}
  .share-panel{padding:14px}
}
</style>
</head>
<body>
<div class="mob-bar">
  <span class="mob-logo">Úkoly</span>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="syncDot" title="Synchronizováno" style="width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;transition:background .3s"></span>
    <button class="mob-menu" onclick="document.querySelector('.sidebar').classList.toggle('open');document.getElementById('sbo').classList.toggle('show')">☰</button>
  </div>
</div>
<!-- sidebar overlay -->
<div id="sbo" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:199" onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>
<style>#sbo.show{display:block!important}</style>
<div class="layout">
  <nav class="sidebar">
    <div class="sb-logo">Úkoly<span>osobní centrum</span></div>
    <div class="sb-group">
      <div class="sb-lbl">Přehled</div>
      <div class="sb-item active" onclick="sf('all',this)"><div class="sb-icon" style="background:rgba(142,142,147,.13)">📋</div>Vše<span class="sb-cnt" id="c-all"></span></div>
      <div class="sb-item" onclick="sf('today',this)"><div class="sb-icon" style="background:rgba(255,159,10,.13)">☀️</div>Dnes<span class="sb-cnt" id="c-today"></span></div>
      <div class="sb-item" onclick="sf('overdue',this)"><div class="sb-icon" style="background:rgba(255,59,48,.1)">⚠️</div>Po termínu<span class="sb-cnt" id="c-overdue"></span></div>
    </div>
    <div class="sb-group">
      <div class="sb-lbl">Kategorie</div>
      <div class="sb-item" onclick="sf('osobni',this)"><div class="sb-icon" style="background:rgba(255,107,53,.1)">🧡</div>Osobní<span class="sb-cnt" id="c-osobni"></span></div>
      <div class="sb-item" onclick="sf('rodina',this)"><div class="sb-icon" style="background:rgba(48,209,88,.1)">💚</div>Rodina<span class="sb-cnt" id="c-rodina"></span></div>
      <div class="sb-item" onclick="sf('prace',this)"><div class="sb-icon" style="background:rgba(10,132,255,.1)">💙</div>Práce<span class="sb-cnt" id="c-prace"></span></div>
    </div>
    <div class="sb-group">
      <div class="sb-lbl">Projekty</div>
      <div class="sb-item" onclick="sf('projekty',this)"><div class="sb-icon" style="background:rgba(94,92,230,.1)">📁</div>Všechny projekty<span class="sb-cnt" id="c-projekty"></span></div>
    </div>
    <div class="sb-spacer"></div>
    <div class="sb-footer">
      <button class="sb-flink" onclick="toggleSP()">🔗 Sdílené pohledy</button>
      <button class="sb-flink" onclick="window.open('dashboard.html','_blank')">👁 Náhled dashboardu</button>
    </div>
  </nav>
  <main class="main">
    <div class="page-hd">
      <div class="page-title" id="pageTitle">Vše</div>
      <button class="btn-add" id="btnAdd" onclick="toggleAdd()">＋ Nový úkol</button>
    </div>
    <div class="share-panel" id="SP"><div class="sp-hd">Sdílené pohledy</div><div id="spList"></div></div>
    <div class="add-panel" id="AP">
      <div class="add-lbl">Nový úkol</div>
      <div class="fg fg2"><div class="f"><label>Název</label><input type="text" id="aT" placeholder="Co je potřeba…"></div><div class="f"><label>Termín</label><input type="date" id="aD"></div></div>
      <div class="fg fg3">
        <div class="f"><label>Kategorie</label><select id="aC" onchange="onCat()"><option value="osobni">🧡 Osobní</option><option value="rodina">💚 Rodina</option><option value="prace">💙 Práce</option></select></div>
        <div class="f"><label>Priorita</label><select id="aP"><option value="high">🔴 Vysoká</option><option value="mid" selected>🟡 Střední</option><option value="low">🟢 Nízká</option></select></div>
        <div class="f"><label>Upozornění</label><input type="time" id="aTm"></div>
      </div>
      <div class="proj-row" id="PR">
        <div class="f"><label>Projekt</label><select id="aPS" onchange="onProj()"><option value="">— bez projektu —</option><option value="__new__">+ Nový projekt…</option></select></div>
        <div class="f" id="NPF" style="display:none"><label>Název projektu</label><input type="text" id="aNP" placeholder="Název…"></div>
      </div>
      <div class="share-row" id="SR">
        <div class="f"><label>Viditelnost</label><select id="aSh" onchange="updHint()"><option value="private">🔒 Soukromé</option></select></div>
        <div class="share-hint" id="SH">Vidíš jen ty.</div>
      </div>
      <div class="fg" style="grid-template-columns:1fr;margin-bottom:10px">
        <div class="f"><label>Poznámka (volitelné)</label><input type="text" id="aNote" placeholder="Krátký popis nebo kontext…"></div>
      </div>
      <div class="add-ft"><button class="btn btn-g" onclick="toggleAdd()">Zrušit</button><button class="btn btn-p" onclick="addTask()">Přidat</button></div>
    </div>
    <!-- add project panel -->
    <div class="add-panel" id="APP">
      <div class="add-lbl">Nový projekt</div>
      <div class="fg fg2">
        <div class="f"><label>Název projektu</label><input type="text" id="pN" placeholder="Název projektu…"></div>
        <div class="f"><label>Termín</label><input type="date" id="pD"></div>
      </div>
      <div class="fg fg2">
        <div class="f"><label>Stav</label><select id="pS"><option value="active">▶ Aktivní</option><option value="paused">⏸ Pozastaveno</option><option value="done">✅ Dokončeno</option></select></div>
        <div class="f"><label>Viditelnost</label><select id="pV"><option value="alex">👔 Alex vidí</option><option value="private">🔒 Soukromý</option></select></div>
      </div>
      <div class="fg" style="grid-template-columns:1fr">
        <div class="f"><label>Poznámka pro Alexe</label><input type="text" id="pNote" placeholder="Krátký kontext, aktuální stav…"></div>
      </div>
      <div class="add-ft"><button class="btn btn-g" onclick="toggleAddProj()">Zrušit</button><button class="btn btn-p" onclick="addProject()">Přidat projekt</button></div>
    </div>
    <div id="TL"></div>
  </main>
</div>
<nav class="mob-nav">
  <button class="mob-nav-btn active" id="mbn-all" onclick="sf('all',null);mobNav('all')"><span>📋</span>Vše</button>
  <button class="mob-nav-btn" id="mbn-today" onclick="sf('today',null);mobNav('today')"><span>☀️</span>Dnes</button>
  <button class="mob-nav-btn" id="mbn-prace" onclick="sf('prace',null);mobNav('prace')"><span>💙</span>Práce</button>
  <button class="mob-nav-btn" id="mbn-projekty" onclick="sf('projekty',null);mobNav('projekty')"><span>📁</span>Projekty</button>
  <button class="mob-nav-btn" id="mbn-add" onclick="toggleAdd()"><span>＋</span>Nový</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const SK='ukoly_v1',SKC='contacts_v1',SKP='projects_v1';
let tasks=[],contacts=[],projects=[],fil='all';

// ── Supabase config ───────────────────────────────────────────────────────────
const SB_URL='https://hkymvggbivowecordrfp.supabase.co';
const SB_KEY='sb_publishable_X8386tw08HixvSiv0qartQ_bDwcb4vd';
const USER_ID='katka'; // unique id for this user's data

async function sbGet(uid){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/tasks?user_id=eq.${uid}&order=updated_at.desc&limit=1`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!r.ok)return null;
    const d=await r.json();
    return d.length?JSON.parse(d[0].data):null;
  }catch{return null}
}

async function sbSave(uid,data){
  try{
    // upsert — insert or update
    await fetch(`${SB_URL}/rest/v1/tasks`,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({user_id:uid,data:JSON.stringify(data),updated_at:new Date().toISOString()})
    });
  }catch(e){console.warn('Supabase save failed',e)}
}

async function sbSaveShared(uid,data){
  try{
    await fetch(`${SB_URL}/rest/v1/tasks`,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({user_id:'shared_'+uid,data:JSON.stringify(data),updated_at:new Date().toISOString()})
    });
  }catch(e){console.warn('Supabase shared save failed',e)}
}

function lC(){try{contacts=JSON.parse(localStorage.getItem(SKC)||'[]')}catch{contacts=[]}if(!contacts.length)contacts=[{id:'alex',name:'Alex',type:'work'},{id:'rodina',name:'Rodina',type:'family'}]}

function lP(){
  try{projects=JSON.parse(localStorage.getItem(SKP)||'[]')}catch{projects=[]}
  if(!projects.length)projects=[{id:'proj_web',name:'Redesign webu',status:'active',date:'',note:'',vis:'alex',created:Date.now()-2e3},{id:'proj_q3',name:'Q3 kampaň',status:'active',date:'2026-07-01',note:'Briefujeme agenturu.',vis:'alex',created:Date.now()-1e3}]
}

function sP(){
  localStorage.setItem(SKP,JSON.stringify(projects));
  saveToCloud();
}

function lT(){
  try{tasks=JSON.parse(localStorage.getItem(SK)||'[]')}catch{tasks=[]}
  if(!tasks.length)tasks=smpl();
}

function sT(){
  localStorage.setItem(SK,JSON.stringify(tasks));
  saveToCloud();
}

let saveTimer=null;
function saveToCloud(){
  // debounce — save after 800ms of inactivity
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const payload={tasks,projects,updatedAt:new Date().toISOString()};
    await sbSave(USER_ID,payload);
    sync();
    setSyncStatus('ok');
  },800);
  setSyncStatus('saving');
}

async function loadFromCloud(){
  setSyncStatus('loading');
  const data=await sbGet(USER_ID);
  if(data){
    if(data.tasks){tasks=data.tasks;localStorage.setItem(SK,JSON.stringify(tasks));}
    if(data.projects){projects=data.projects;localStorage.setItem(SKP,JSON.stringify(projects));}
  } else {
    lT();lP();
  }
  // load Alex-added projects and merge
  const alexData=await sbGet('alex_comments');
  if(alexData&&alexData.projects){
    alexData.projects.forEach(ap=>{
      if(!projects.find(p=>p.id===ap.id)){
        projects.push({...ap,fromAlex:true});
      }
    });
  }
  setSyncStatus('ok');
  ppS();
  render();
}

function setSyncStatus(s){
  const el=document.getElementById('syncDot');
  if(!el)return;
  el.title=s==='ok'?'Synchronizováno':s==='saving'?'Ukládám…':s==='loading'?'Načítám…':'Offline – lokální data';
  el.style.background=s==='ok'?'var(--rodina)':s==='saving'?'var(--mid)':s==='offline'?'var(--high)':'var(--muted)';
}

async function sync(){
  contacts.forEach(async c=>{
    const sh=tasks.filter(t=>t.share===c.id),pm={};
    sh.forEach(t=>{const k=t.projId||'__none__';if(!pm[k])pm[k]=[];pm[k].push(t);});
    const sharedProjs=c.id==='alex'?projects.filter(p=>p.vis==='alex'||!p.vis):projects.filter(p=>p.vis===c.id);
    const pkg={tasks:sh,projMap:pm,projects:sharedProjs,updatedAt:new Date().toISOString(),owner:'Katka'};
    // save to localStorage for same-device dashboard
    localStorage.setItem('shared_'+c.id,JSON.stringify(pkg));
    // save to Supabase for cross-device dashboard
    await sbSaveShared(c.id,pkg);
  });
}

function ds(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);const dt=new Date(d);dt.setHours(0,0,0,0);return dt<t?'ov':dt.getTime()===t.getTime()?'td':'fut'}
function fd(d){
  if(!d)return'';const t=new Date();t.setHours(0,0,0,0);const dt=new Date(d);dt.setHours(0,0,0,0);
  const df=Math.round((dt-t)/86400000);
  if(df===0)return'Dnes';if(df===1)return'Zítra';if(df===-1)return'Včera';
  if(df<0)return`${Math.abs(df)}d zpět`;
  return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'short'});
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pn(id){if(!id)return null;const p=projects.find(p=>p.id===id);return p?p.name:null}
function cn(id){if(!id||id==='private')return null;const c=contacts.find(c=>c.id===id);return c?c.name:id}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}

const ftitles={all:'Vše',today:'Dnes',overdue:'Po termínu',osobni:'Osobní',rodina:'Rodina',prace:'Práce',projekty:'Projekty'};
function mobNav(f){
  document.querySelectorAll('.mob-nav-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('mbn-'+f);
  if(el)el.classList.add('active');
}

function sf(f,el){
  fil=f;
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  if(el)el.classList.add('active');
  document.getElementById('pageTitle').textContent=ftitles[f]||f;
  const isProj=f==='projekty';
  document.getElementById('btnAdd').textContent=isProj?'＋ Nový projekt':'＋ Nový úkol';
  document.getElementById('btnAdd').onclick=isProj?toggleAddProj:toggleAdd;
  document.getElementById('AP').classList.remove('open');
  document.getElementById('APP').classList.remove('open');
  // close sidebar on mobile
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sbo').classList.remove('show');
  render();
}

function gf(){
  let l=[...tasks];
  if(fil==='today')l=l.filter(t=>ds(t.date)==='td');
  else if(fil==='overdue')l=l.filter(t=>!t.done&&ds(t.date)==='ov');
  else if(['osobni','rodina','prace'].includes(fil))l=l.filter(t=>t.cat===fil);
  l.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;return{high:0,mid:1,low:2}[a.prio]-{high:0,mid:1,low:2}[b.prio]});
  return l;
}

function uc(){
  const a=tasks.filter(t=>!t.done);
  document.getElementById('c-all').textContent=a.length||'';
  document.getElementById('c-today').textContent=a.filter(t=>ds(t.date)==='td').length||'';
  document.getElementById('c-overdue').textContent=a.filter(t=>ds(t.date)==='ov').length||'';
  document.getElementById('c-osobni').textContent=a.filter(t=>t.cat==='osobni').length||'';
  document.getElementById('c-rodina').textContent=a.filter(t=>t.cat==='rodina').length||'';
  document.getElementById('c-prace').textContent=a.filter(t=>t.cat==='prace').length||'';
  document.getElementById('c-projekty').textContent=projects.length||'';
}

const catL={osobni:'Osobní',rodina:'Rodina',prace:'Práce'};
const prioL={high:'Vysoká',mid:'Střední',low:'Nízká'};
const statusL={active:'▶ Aktivní',paused:'⏸ Pozastaveno',done:'✅ Dokončeno'};

function render(){
  uc();
  if(fil==='projekty'){renderProjects();return;}
  const l=gf(),c=document.getElementById('TL');
  if(!l.length){c.innerHTML='<div class="empty"><span class="empty-ico">✨</span>Žádné úkoly v tomto pohledu.</div>';return}
  const active=l.filter(t=>!t.done),done=l.filter(t=>t.done);
  let h='';
  if(active.length)h+=`<div class="task-group">${active.map(rc).join('')}</div>`;
  if(done.length)h+=`<div class="done-div">Splněno (${done.length})</div><div class="task-group">${done.map(rc).join('')}</div>`;
  c.innerHTML=h;
}

function getPct(projId){
  const pt=tasks.filter(t=>t.projId===projId);
  if(!pt.length)return null;
  return Math.round(pt.filter(t=>t.done).length/pt.length*100);
}

function renderProjects(){
  const c=document.getElementById('TL');
  if(!projects.length){c.innerHTML='<div class="empty"><span class="empty-ico">📁</span>Zatím žádné projekty.</div>';return}
  const active=projects.filter(p=>p.status!=='done'&&p.status!=='archived');
  const done=projects.filter(p=>p.status==='done');
  const archived=projects.filter(p=>p.status==='archived');
  let h='<div class="proj-grid">';
  active.forEach(p=>h+=renderProjCard(p));
  h+='</div>';
  if(done.length){
    h+=`<div class="done-div">Dokončeno (${done.length})</div><div class="proj-grid">`;
    done.forEach(p=>h+=renderProjCard(p));
    h+='</div>';
  }
  if(archived.length){
    h+=`<div class="done-div">Archivováno (${archived.length})</div><div class="proj-grid">`;
    archived.forEach(p=>h+=renderProjCard(p));
    h+='</div>';
  }
  c.innerHTML=h;
}

function renderProjCard(p){
  const pct=getPct(p.id);
  const taskCount=tasks.filter(t=>t.projId===p.id&&!t.done).length;
  const fillColor=pct===100?'var(--rodina)':pct>=50?'var(--mid)':'var(--prace)';
  const ds2=ds(p.date),dc=ds2==='ov'?' ov':ds2==='td'?' td':'';
  const isArchived=p.status==='archived';
  return`<div class="proj-card"${isArchived?' style="opacity:.55"':''}>
    <div class="proj-card-top">
      <div class="proj-card-info">
        <div class="proj-card-name">${esc(p.name)}${p.fromAlex?'<span style="font-size:.68rem;background:rgba(10,132,255,.1);color:var(--prace);border-radius:6px;padding:1px 6px;margin-left:6px">👔 Alex</span>':''}</div>
        <div class="proj-card-meta">
          <span class="chip chip-status-${p.status||'active'}">${p.status==='archived'?'📦 Archivováno':p.status==='done'?'✅ Dokončeno':p.status==='paused'?'⏸ Pozastaveno':'▶ Aktivní'}</span>
          ${p.vis==='alex'?'<span class="chip c-share">🔗 Alex</span>':'<span class="chip c-priv">🔒 Soukromý</span>'}
          ${p.date?`<span class="tdate${dc}">${fd(p.date)}</span>`:''}
          ${taskCount>0?`<span class="chip c-prace">${taskCount} úkolů</span>`:''}
        </div>
        ${p.note?`<div class="proj-card-note">${esc(p.note)}</div>`:''}
      </div>
      <div class="proj-actions">
        ${!isArchived
          ?`<button class="pabtn-archive" onclick="archiveProj('${p.id}')" title="Archivovat">📦</button>`
          :`<button class="pabtn-archive" onclick="unarchiveProj('${p.id}')" title="Obnovit">↩</button>`
        }
        <button class="pabtn" onclick="delProj('${p.id}')" title="Smazat">×</button>
      </div>
    </div>
    ${pct!==null?`<div class="prog-row"><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${fillColor}"></div></div><span class="prog-pct">${pct}%</span></div>`:''}
  </div>`;
}

const openSubs=new Set();

function rc(t){
  const s=ds(t.date),dc=s==='ov'?' ov':s==='td'?' td':'';
  const p=pn(t.projId),cont=cn(t.share);
  const subs=t.subtasks||[];
  const doneSubs=subs.filter(s=>s.done).length;
  const sch=t.share==='private'
    ?`<span class="chip c-priv">🔒 Soukromé</span>`
    :`<span class="chip c-share" onclick="cpLink('${t.share}')" title="Kopírovat odkaz">🔗 ${esc(cont)}</span>`;
  const isOpen=openSubs.has(t.id);
  const subHtml=isOpen?`
    <div class="subtasks">
      ${subs.map(sub=>`<div class="subtask-row">
        <div class="sub-chk${sub.done?' on':''}" onclick="togSub(${t.id},${sub.id})"></div>
        <span class="sub-name${sub.done?' done':''}">${esc(sub.name)}</span>
        <button class="sub-del" onclick="delSub(${t.id},${sub.id})">×</button>
      </div>`).join('')}
      <div class="sub-add-row">
        <input type="text" id="si_${t.id}" placeholder="Přidat podúkol…" onkeydown="if(event.key==='Enter')addSub(${t.id})">
        <button class="sub-add-btn" onclick="addSub(${t.id})">+ Přidat</button>
      </div>
    </div>`:'';
  const subToggle=`<button class="sub-toggle" onclick="toggleSubs(${t.id})">
    ${subs.length?`${doneSubs}/${subs.length} podúkolů`:'+ Podúkoly'} ${isOpen?'▲':'▼'}
  </button>`;
  return`<div class="task-card${t.done?' done':''}" data-id="${t.id}">
    <div class="chk${t.done?' on':''}" onclick="tog(${t.id})"></div>
    <div class="tbody">
      <div class="ttl">${esc(t.title)}</div>
      ${t.note?`<div style="font-size:.78rem;color:var(--muted);margin-bottom:4px;line-height:1.4">${esc(t.note)}</div>`:''}
      <div class="meta">
        <span class="chip c-${t.cat}">${catL[t.cat]}</span>
        <span class="chip c-${t.prio}">${prioL[t.prio]}</span>
        ${p?`<span class="chip c-proj">📁 ${esc(p)}</span>`:''}
        ${t.date?`<span class="tdate${dc}">${fd(t.date)}</span>`:''}
        ${sch}
      </div>
      ${subToggle}
      ${subHtml}
    </div>
    ${t.date?`<button class="calbtn" onclick="exportIcs(${t.id})" title="Přidat do kalendáře">📅</button>`:''}
    <button class="xbtn" onclick="del(${t.id})">×</button>
  </div>`;
}

function toggleSubs(id){if(openSubs.has(id))openSubs.delete(id);else openSubs.add(id);render();}
function addSub(tid){
  const t=tasks.find(t=>t.id===tid);if(!t)return;
  const inp=document.getElementById('si_'+tid);if(!inp)return;
  const name=inp.value.trim();if(!name)return;
  if(!t.subtasks)t.subtasks=[];
  t.subtasks.push({id:Date.now(),name,done:false});
  openSubs.add(tid);sT();render();
}
function togSub(tid,sid){
  const t=tasks.find(t=>t.id===tid);if(!t||!t.subtasks)return;
  const s=t.subtasks.find(s=>s.id===sid);if(!s)return;
  s.done=!s.done;openSubs.add(tid);sT();render();
}
function delSub(tid,sid){
  const t=tasks.find(t=>t.id===tid);if(!t||!t.subtasks)return;
  t.subtasks=t.subtasks.filter(s=>s.id!==sid);openSubs.add(tid);sT();render();
}

function tog(id){const t=tasks.find(t=>t.id===id);if(!t)return;t.done=!t.done;if(t.done)toast('✓ Splněno');sT();render()}
function del(id){tasks=tasks.filter(t=>t.id!==id);sT();render();toast('Smazáno')}

function toggleAdd(){const p=document.getElementById('AP');p.classList.toggle('open');document.getElementById('APP').classList.remove('open');if(p.classList.contains('open'))document.getElementById('aT').focus()}
function toggleAddProj(){const p=document.getElementById('APP');p.classList.toggle('open');document.getElementById('AP').classList.remove('open');if(p.classList.contains('open'))document.getElementById('pN').focus()}

function addProject(){
  const name=document.getElementById('pN').value.trim();if(!name)return;
  const p={id:'proj_'+Date.now(),name,status:document.getElementById('pS').value,date:document.getElementById('pD').value,note:document.getElementById('pNote').value.trim(),vis:document.getElementById('pV').value,created:Date.now()};
  projects.unshift(p);sP();ppS();
  document.getElementById('pN').value='';document.getElementById('pD').value='';document.getElementById('pNote').value='';
  document.getElementById('APP').classList.remove('open');render();toast('📁 Projekt přidán');
}
function archiveProj(id){
  const p=projects.find(p=>p.id===id);if(!p)return;
  p.status='archived';sP();ppS();render();toast('📦 Projekt archivován');
}
function unarchiveProj(id){
  const p=projects.find(p=>p.id===id);if(!p)return;
  p.status='active';sP();ppS();render();toast('↩ Projekt obnoven');
}
function delProj(id){projects=projects.filter(p=>p.id!==id);sP();ppS();render();toast('Projekt smazán')}

function onCat(){
  const cat=document.getElementById('aC').value,PR=document.getElementById('PR'),SR=document.getElementById('SR'),ss=document.getElementById('aSh');
  if(cat==='prace'){PR.classList.add('on');SR.classList.add('on');ss.innerHTML=`<option value="private">🔒 Soukromé</option>`+contacts.filter(c=>c.type==='work').map(c=>`<option value="${c.id}">👔 ${esc(c.name)}</option>`).join('')}
  else if(cat==='rodina'){PR.classList.remove('on');SR.classList.add('on');ss.innerHTML=`<option value="private">🔒 Soukromé</option>`+contacts.filter(c=>c.type==='family').map(c=>`<option value="${c.id}">👨‍👩‍👧 ${esc(c.name)}</option>`).join('')}
  else{PR.classList.remove('on');SR.classList.add('on');ss.innerHTML=`<option value="private">🔒 Soukromé</option>`}
  updHint();
}

function updHint(){
  const v=document.getElementById('aSh').value,h=document.getElementById('SH');
  h.textContent=v==='private'?'Vidíš jen ty.':v==='alex'?'Zobrazí se Alexovi na jeho dashboardu.':'Zobrazí se sdílenému rodinnému pohledu.';
}

function onProj(){document.getElementById('NPF').style.display=document.getElementById('aPS').value==='__new__'?'':'none'}

function ppS(){
  const s=document.getElementById('aPS');
  s.innerHTML=`<option value="">— bez projektu —</option>`
    +projects.map(p=>`<option value="${p.id}">${p.fromAlex?'👔 ':''} ${esc(p.name)}</option>`).join('')
    +`<option value="__new__">+ Nový projekt…</option>`;
}

function addTask(){
  const title=document.getElementById('aT').value.trim();if(!title)return;
  const cat=document.getElementById('aC').value;let projId=null;
  if(cat==='prace'){const ps=document.getElementById('aPS').value;if(ps==='__new__'){const nn=document.getElementById('aNP').value.trim();if(nn){let p=projects.find(p=>p.name===nn);if(!p){p={id:'proj_'+Date.now(),name:nn};projects.push(p);sP();ppS();}projId=p.id;}}else if(ps)projId=ps;}
  tasks.unshift({id:Date.now(),title,cat,prio:document.getElementById('aP').value,date:document.getElementById('aD').value,time:document.getElementById('aTm').value,share:document.getElementById('aSh').value,note:document.getElementById('aNote').value.trim(),projId,done:false,created:Date.now()});
  sT();render();
  document.getElementById('aT').value='';document.getElementById('aD').value='';document.getElementById('aTm').value='';document.getElementById('aNP').value='';document.getElementById('aNote').value='';
  document.getElementById('AP').classList.remove('open');toast('✚ Úkol přidán');
}

function toggleSP(){
  const p=document.getElementById('SP');p.classList.toggle('on');
  if(!p.classList.contains('on'))return;
  const base=location.href.replace('app.html','dashboard.html');
  document.getElementById('spList').innerHTML=contacts.map(c=>`
    <div class="sp-row">
      <span class="sp-name">${c.type==='work'?'👔':'👨‍👩‍👧'} ${esc(c.name)}</span>
      <span class="sp-url">${esc(base+'#'+c.id)}</span>
      <button class="btn-cp" onclick="cpTxt('${base+'#'+c.id}')">Kopírovat</button>
    </div>`).join('');
}

function cpLink(cid){cpTxt(location.href.replace('app.html','dashboard.html')+'#'+cid)}
function cpTxt(txt){
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('📋 Zkopírováno'));
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('📋 Zkopírováno')}
}

function exportIcs(id){
  const t=tasks.find(t=>t.id===id);if(!t||!t.date)return;
  const dt=t.date.replace(/-/g,'');
  let dtStart,dtEnd;
  if(t.time){
    const[h,m]=t.time.split(':');
    const pad=n=>String(n).padStart(2,'0');
    dtStart=dt+'T'+pad(h)+pad(m)+'00';
    dtEnd=dt+'T'+pad(Number(h)+1)+pad(m)+'00';
  } else {
    dtStart=dt;dtEnd=dt;
  }
  const uid=`ukoly-${t.id}@kfischerova`;
  const now=new Date().toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const allDay=!t.time;
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ukoly//CS',
    'BEGIN:VEVENT',
    `UID:${uid}`,`DTSTAMP:${now}`,
    allDay?`DTSTART;VALUE=DATE:${dtStart}`:`DTSTART:${dtStart}`,
    allDay?`DTEND;VALUE=DATE:${dtEnd}`:`DTEND:${dtEnd}`,
    `SUMMARY:${t.title}`,
    `DESCRIPTION:Kategorie: ${catL[t.cat]} | Priorita: ${prioL[t.prio]}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=t.title.replace(/[^a-z0-9]/gi,'_').slice(0,40)+'.ics';
  a.click();URL.revokeObjectURL(a.href);
  toast('📅 Exportováno do kalendáře');
}

if('Notification'in window&&Notification.permission==='default')setTimeout(()=>Notification.requestPermission(),2e3);
