<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--card3:#E5E5EA;
  --ink:#1C1C1E;--ink2:#3A3A3C;--muted:#8E8E93;--border:rgba(60,60,67,.12);
  --sage:#30D158;--sage-l:rgba(48,209,88,.1);
  --amber:#FF9F0A;--amber-l:rgba(255,159,10,.1);
  --rose:#FF3B30;--rose-l:rgba(255,59,48,.1);
  --sky:#0A84FF;--sky-l:rgba(10,132,255,.1);
  --r:13px;--r-lg:18px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:48px 24px 60px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto}

/* header */
.hd{margin-bottom:40px}
.hd-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;line-height:1}
h1 span{font-weight:300;color:var(--muted)}
.hd-meta{font-size:.76rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.ref-btn{background:var(--card);border:1px solid var(--border);border-radius:100px;padding:6px 16px;font-family:inherit;font-size:.78rem;font-weight:500;color:var(--ink2);cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s,transform .1s}
.ref-btn:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:36px}
@media(max-width:560px){.summary{grid-template-columns:repeat(2,1fr)}}
.sum{background:var(--card);border-radius:var(--r-lg);padding:18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sum::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 var(--r-lg) var(--r-lg)}
.sum.s1::after{background:var(--sky)}
.sum.s2::after{background:var(--sage)}
.sum.s3::after{background:var(--amber)}
.sum.s4::after{background:var(--rose)}
.sum-n{font-size:2rem;font-weight:700;line-height:1;margin-bottom:3px;letter-spacing:-.02em}
.sum-l{font-size:.72rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* section */
.sec{margin-bottom:32px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-title{font-size:1.1rem;font-weight:600;letter-spacing:-.01em}
.sec-n{font-size:.75rem;font-weight:600;background:var(--card3);border-radius:100px;padding:2px 9px;color:var(--muted)}

/* project block */
.pb{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px;transition:box-shadow .15s;animation:up .22s ease}
.pb:hover{box-shadow:var(--shadow-md)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pb-head{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;cursor:pointer;user-select:none}
.pb-bar{width:4px;height:36px;border-radius:4px;flex-shrink:0}
.pb-info{flex:1}
.pb-name{font-size:1rem;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
.pb-sub{font-size:.73rem;color:var(--muted)}
.pb-pct{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;flex-shrink:0}
.chev{font-size:.8rem;color:var(--muted);flex-shrink:0}
.prog{padding:0 18px 12px 34px;display:flex;align-items:center;gap:10px}
.prog-track{flex:1;height:4px;background:var(--card3);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.prog-pct{font-size:.73rem;font-weight:600;color:var(--muted);min-width:32px;text-align:right}
.pb-body{padding:0 18px 16px 34px;border-top:1px solid var(--border);padding-top:12px;display:none}
.pb-body.open{display:block}
.sub-lbl{font-size:.69rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* task rows in project */
.tr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(60,60,67,.06)}
.tr:last-child{border-bottom:none}
.tr-chk{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tr-chk.done{background:rgba(48,209,88,.15);border-color:var(--sage)}
.tr-chk.done::after{content:'✓';color:var(--sage);font-size:9px;font-weight:700}
.tr-name{flex:1;font-size:.84rem;font-weight:500}
.tr-name.done{text-decoration:line-through;color:var(--muted)}
.tr-date{font-size:.71rem;color:var(--muted)}
.tr-date.ov{color:var(--rose);font-weight:600}
.tr-date.td{color:var(--amber);font-weight:600}
.chip{display:inline-flex;align-items:center;font-size:.69rem;font-weight:500;border-radius:100px;padding:2px 8px;white-space:nowrap}
.c-high{background:rgba(255,59,48,.1);color:var(--rose)}
.c-mid{background:rgba(255,159,10,.1);color:var(--amber)}
.c-low{background:rgba(48,209,88,.1);color:var(--sage)}

/* family task cards */
.fc{background:var(--card);border-radius:var(--r-lg);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;box-shadow:var(--shadow);transition:box-shadow .15s;animation:up .18s ease}
.fc:hover{box-shadow:var(--shadow-md)}
.fc.done{opacity:.38}
.fc.done .fc-title{text-decoration:line-through;color:var(--muted)}
.fc-chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.fc-chk.done{background:rgba(48,209,88,.12);border-color:var(--sage)}
.fc-chk.done::after{content:'✓';color:var(--sage);font-size:11px;font-weight:700}
.fc-body{flex:1;min-width:0}
.fc-title{font-size:.91rem;font-weight:500;margin-bottom:5px;line-height:1.35}
.fc-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fc-date{font-size:.73rem;color:var(--muted)}
.fc-date.ov{color:var(--rose);font-weight:600}
.fc-date.td{color:var(--amber);font-weight:600}

/* progress fill colors */
.fill-0{background:var(--card3)}
.fill-lo{background:rgba(255,159,10,.5)}
.fill-mi{background:var(--amber)}
.fill-hi{background:var(--sage)}
.fill-dn{background:var(--sage)}

/* no data / loading */
.nd{text-align:center;padding:72px 20px;color:var(--muted)}
.nd-ico{font-size:3rem;margin-bottom:14px;display:block}
.ld{text-align:center;padding:60px}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--sky);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* done divider */
.ddiv{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 0 8px;display:flex;align-items:center;gap:8px}
.ddiv::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="hd-row">
      <h1 id="title">Dashboard <span>—</span></h1>
      <button class="ref-btn" onclick="load()">↻ Obnovit</button>
    </div>
    <div class="hd-meta"><span id="upd">Načítám…</span><span id="own"></span></div>
  </div>
  <div class="summary" id="sum"></div>
  <div id="content"><div class="ld"><div class="spin"></div>Načítám…</div></div>
</div>
<script>
const vid=location.hash.replace('#','')||null;
const openB=new Set();

function ds(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);const dt=new Date(d);dt.setHours(0,0,0,0);return dt<t?'ov':dt.getTime()===t.getTime()?'td':'fut'}
function fd(d){
  if(!d)return'';const t=new Date();t.setHours(0,0,0,0);const dt=new Date(d);dt.setHours(0,0,0,0);
  const df=Math.round((dt-t)/86400000);
  if(df===0)return'Dnes';if(df===1)return'Zítra';if(df<0)return`${Math.abs(df)}d zpět`;
  return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'short'});
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pct(tasks){if(!tasks||!tasks.length)return 0;return Math.round(tasks.filter(t=>t.done).length/tasks.length*100)}
function fc(p){return p===100?'fill-dn':p>=60?'fill-hi':p>=30?'fill-mi':p>0?'fill-lo':'fill-0'}
function pc(p){return p==='high'?'var(--rose)':p==='mid'?'var(--amber)':'var(--sage)'}

function load(){
  let data=null;
  if(vid){try{const r=localStorage.getItem('shared_'+vid);if(r)data=JSON.parse(r)}catch{}}
  if(!data){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('shared_')){try{data=JSON.parse(localStorage.getItem(k));break}catch{}}}}
  if(!data){noData();return}
  render(data);
}

function noData(){
  document.getElementById('title').innerHTML='Dashboard <span>—</span>';
  document.getElementById('content').innerHTML=`<div class="nd"><span class="nd-ico">📭</span><p style="font-size:.9rem;font-weight:500">Data zatím nejsou k dispozici.</p><p style="font-size:.8rem;margin-top:6px">Zkontroluj odkaz nebo požádej o aktualizaci.</p></div>`;
}

function render(data){
  const isAlex=vid==='alex'||(!vid&&data.projMap);
  const name=isAlex?'Alex':'Rodina';
  document.getElementById('title').innerHTML=`Přehled <span>— ${name}</span>`;
  document.getElementById('upd').textContent='Aktualizováno: '+(data.updatedAt?new Date(data.updatedAt).toLocaleString('cs-CZ'):'—');
  document.getElementById('own').textContent=data.owner?'Sdílí: '+data.owner:'';

  const tasks=data.tasks||[];
  const active=tasks.filter(t=>!t.done).length,done=tasks.filter(t=>t.done).length;
  const overdue=tasks.filter(t=>!t.done&&ds(t.date)==='ov').length,today=tasks.filter(t=>!t.done&&ds(t.date)==='td').length;
  document.getElementById('sum').innerHTML=`
    <div class="sum s1"><div class="sum-n">${active}</div><div class="sum-l">Aktivních</div></div>
    <div class="sum s2"><div class="sum-n">${done}</div><div class="sum-l">Splněno</div></div>
    <div class="sum s3"><div class="sum-n">${today}</div><div class="sum-l">Dnes</div></div>
    <div class="sum s4"><div class="sum-n">${overdue}</div><div class="sum-l">Po termínu</div></div>
  `;
  if(isAlex)renderAlex(data);else renderFamily(data);
}

function renderAlex(data){
  const tasks=data.tasks||[],projects=data.projects||[];
  let html='';
  projects.forEach(p=>{
    const pt=(data.projMap&&data.projMap[p.id])||tasks.filter(t=>t.projId===p.id);
    if(!pt.length)return;
    const pp=pct(pt),isO=openB.has(p.id);
    const rows=pt.map(t=>{
      const s=ds(t.date),dc=s==='ov'?' ov':s==='td'?' td':'';
      return`<div class="tr"><div class="tr-chk${t.done?' done':''}"></div><span class="tr-name${t.done?' done':''}">${esc(t.title)}</span><span class="chip c-${t.prio}">${t.prio==='high'?'Vysoká':t.prio==='mid'?'Střední':'Nízká'}</span>${t.date?`<span class="tr-date${dc}">${fd(t.date)}</span>`:''}</div>`;
    }).join('');
    html+=`<div class="pb" data-pid="${p.id}">
      <div class="pb-head" onclick="togB('${p.id}')">
        <div class="pb-bar" style="background:${pp===100?'var(--sage)':pp>=50?'var(--amber)':'var(--sky)'}"></div>
        <div class="pb-info"><div class="pb-name">${esc(p.name)}</div><div class="pb-sub">${pt.filter(t=>!t.done).length} zbývá · ${pt.filter(t=>t.done).length} splněno</div></div>
        <div class="pb-pct" style="color:${pp===100?'var(--sage)':pp>=50?'var(--amber)':'var(--ink)'}">${pp}%</div>
        <div class="chev">${isO?'▲':'▼'}</div>
      </div>
      <div class="prog"><div class="prog-track"><div class="prog-fill ${fc(pp)}" style="width:${pp}%"></div></div></div>
      <div class="pb-body${isO?' open':''}"><div class="sub-lbl">Úkoly</div>${rows}</div>
    </div>`;
  });
  const loose=(data.projMap&&data.projMap['__none__'])||tasks.filter(t=>!t.projId);
  if(loose.length){
    html+=`<div class="sec"><div class="sec-hd"><div class="sec-title" style="font-size:.95rem">Ostatní</div><span class="sec-n">${loose.length}</span></div>`;
    html+=`<div style="background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;padding:0 16px">`;
    html+=loose.map(t=>{const s=ds(t.date),dc=s==='ov'?' ov':s==='td'?' td':'';return`<div class="tr"><div class="tr-chk${t.done?' done':''}"></div><span class="tr-name${t.done?' done':''}">${esc(t.title)}</span><span class="chip c-${t.prio}">${t.prio==='high'?'Vysoká':t.prio==='mid'?'Střední':'Nízká'}</span>${t.date?`<span class="tr-date${dc}">${fd(t.date)}</span>`:''}</div>`;}).join('');
    html+=`</div></div>`;
  }
  document.getElementById('content').innerHTML=html||`<div class="nd"><span class="nd-ico">✨</span>Žádné sdílené úkoly.</div>`;
}

function renderFamily(data){
  const tasks=data.tasks||[];
  if(!tasks.length){document.getElementById('content').innerHTML=`<div class="nd"><span class="nd-ico">🌿</span>Žádné sdílené úkoly.</div>`;return}
  const active=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
  let h=`<div class="sec"><div class="sec-hd"><div class="sec-title">Úkoly</div><span class="sec-n">${active.length}</span></div>`;
  h+=active.map(fcard).join('');
  if(done.length)h+=`<div class="ddiv">Splněno (${done.length})</div>`+done.map(fcard).join('');
  h+=`</div>`;
  document.getElementById('content').innerHTML=h;
}

function fcard(t){
  const s=ds(t.date),dc=s==='ov'?' ov':s==='td'?' td':'';
  return`<div class="fc${t.done?' done':''}">
    <div class="fc-chk${t.done?' done':''}"></div>
    <div class="fc-body">
      <div class="fc-title">${esc(t.title)}</div>
      <div class="fc-meta">
        <span class="chip c-${t.prio}">${t.prio==='high'?'🔴 Vysoká':t.prio==='mid'?'🟡 Střední':'🟢 Nízká'}</span>
        ${t.date?`<span class="fc-date${dc}">${fd(t.date)}</span>`:''}
      </div>
    </div>
  </div>`;
}

function togB(id){
  if(openB.has(id))openB.delete(id);else openB.add(id);
  document.querySelectorAll('.pb').forEach(el=>{
    const pid=el.dataset.pid;
    el.querySelector('.pb-body').classList.toggle('open',openB.has(pid));
    el.querySelector('.chev').textContent=openB.has(pid)?'▲':'▼';
  });
}

setInterval(load,30000);
load();
</script>
</body>
</html>
